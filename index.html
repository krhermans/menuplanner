<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mijn Menuplanner</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#2E6A3C">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,-apple-system,sans-serif}
img{max-width:100%}[hidden]{display:none!important}
</style>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Menuplanner">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: één kolom op de telefoon, twee weekkolommen vanaf tabletbreedte; vaste tabbalk onderaan; sheets schuiven van onder open */
:root{
  --bg:#F3F5EF; --surface:#FFFFFF; --sunk:#E7ECE2; --line:#D6DDCF;
  --fg:#1C2419; --muted:#5E6B58; --accent:#2E6A3C; --accent-fg:#FFFFFF;
  --accent-soft:#DCEAD9; --mustard:#B98712; --mustard-soft:#F4E7C6; --danger:#B4412F; --warn-soft:#F7E1D9;
  --klass:#2E6A3C; --samen:#2F6E8F; --samen-soft:#D9E8F0;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121711; --surface:#1B221A; --sunk:#232C22; --line:#2F3A2D;
  --fg:#E8EDE3; --muted:#9AA894; --accent:#7CC08A; --accent-fg:#0F1A10;
  --accent-soft:#24372A; --mustard:#E0B44A; --mustard-soft:#3A3220; --danger:#E27A66; --warn-soft:#3B2620;
  --klass:#7CC08A; --samen:#7DB6D6; --samen-soft:#1F3340; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121711; --surface:#1B221A; --sunk:#232C22; --line:#2F3A2D;
  --fg:#E8EDE3; --muted:#9AA894; --accent:#7CC08A; --accent-fg:#0F1A10;
  --accent-soft:#24372A; --mustard:#E0B44A; --mustard-soft:#3A3220; --danger:#E27A66; --warn-soft:#3B2620;
  --klass:#7CC08A; --samen:#7DB6D6; --samen-soft:#1F3340; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:18px 120px}
.narrow{max-width:680px;margin-inline:auto}
h1{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:1.2rem;margin:0;text-wrap:balance}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.head{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.small{padding:5px 11px;font-size:.84rem;min-height:32px}
.btn[disabled]{opacity:.45;cursor:default}
.icon-btn{border:0;background:transparent;width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;color:var(--muted);font-size:1.1rem;flex:none}
.icon-btn:hover{background:var(--sunk)}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:.9rem;margin-bottom:14px}
.banner.warn{background:var(--warn-soft)}
.note{font-size:.84rem;color:var(--muted);margin:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--fg);white-space:nowrap}
.chip.klass{background:var(--accent-soft);color:var(--klass)}
.chip.samen{background:var(--samen-soft);color:var(--samen)}
.chip.warn{background:var(--warn-soft);color:var(--danger)}
.star{color:var(--mustard)}
.empty{padding:26px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}

/* planning */
.weeknav{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;margin-bottom:14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6}
.weeknav .wk{flex:1;min-width:0;text-align:center;line-height:1.25}
.weeknav .wk b{display:block;font-family:var(--display);font-weight:400;font-size:1.15rem;font-variant-numeric:tabular-nums}
.weeknav .wk small{color:var(--muted);font-size:.8rem;font-weight:600}
.navbtn{border:1px solid var(--line);background:var(--bg);width:44px;height:44px;border-radius:12px;font-size:1.5rem;line-height:1;color:var(--accent);flex:none;display:grid;place-items:center}
.navbtn:hover{background:var(--accent-soft)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;font-size:inherit}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.nav .range{font-weight:700;font-variant-numeric:tabular-nums;padding-inline:6px}
.weeks{display:grid;gap:22px}
@media (min-width:900px){.weeks{grid-template-columns:1fr 1fr;gap:22px 26px}}
.week{min-width:0}
.week-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:6px;z-index:5}
.week-h h2{flex:1;min-width:110px}
.days{display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 10px 8px}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.date{text-align:center;line-height:1.05;padding-top:2px}
.date small{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.date b{display:block;font-family:var(--display);font-weight:400;font-size:1.5rem;font-variant-numeric:tabular-nums}
.date i{font-style:normal;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.slots{display:flex;flex-direction:column;gap:8px;min-width:0}
.slot{display:flex;gap:8px;align-items:flex-start}
.slot.alt{border-top:1px dashed var(--line);padding-top:8px}
.slot .main{flex:1;min-width:0}
.dish-btn{border:0;background:transparent;padding:0;text-align:left;font-weight:600;overflow-wrap:anywhere;line-height:1.3;width:100%}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.add-slot{border:1.5px dashed var(--line);background:transparent;border-radius:10px;padding:9px 12px;color:var(--muted);text-align:left;width:100%;font-weight:600}
.pers{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;flex:none;background:var(--bg)}
.pers button{border:0;background:transparent;width:28px;height:30px;color:var(--accent);font-weight:700;font-size:1rem}
.pers span{min-width:30px;text-align:center;font-size:.84rem;font-weight:700;font-variant-numeric:tabular-nums}
.altcheck{display:flex;gap:8px;align-items:center;font-size:.84rem;color:var(--muted);font-weight:600;cursor:pointer;width:max-content}
.altcheck input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.dayfoot{display:flex;align-items:center;gap:4px 14px;flex-wrap:wrap}
.notebtn{border:0;background:none;padding:2px 0;color:var(--muted);font-size:.84rem;font-weight:600}
.notebtn:hover{color:var(--accent)}
.notetxt{border:0;background:var(--mustard-soft);border-radius:10px;padding:7px 10px;text-align:left;font-size:.88rem;line-height:1.35;overflow-wrap:anywhere;width:100%}
.notetxt span{display:block;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:1px}
.noteform{display:flex;flex-direction:column;gap:6px}
.noteform textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:.95rem;resize:vertical;width:100%}
.slotlabel{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* lijsten en zoeken */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:1rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.group{margin-top:18px}
.group>h3{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700;display:flex;gap:8px;align-items:center}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;gap:10px;align-items:center;padding:11px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0}
.item .t b{font-weight:600;display:block;overflow-wrap:anywhere}
.item .t small{color:var(--muted);font-size:.8rem;display:block}
.item.off{opacity:.55}

/* boodschappen */
.weekchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.check{display:flex;gap:12px;align-items:center;padding:10px 8px 10px 14px;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check label{display:flex;gap:12px;align-items:center;flex:1;min-width:0;cursor:pointer}
.check input{appearance:none;width:22px;height:22px;border:2px solid var(--line);border-radius:7px;flex:none;margin:0;display:grid;place-items:center;background:var(--surface)}
.check input:checked{background:var(--accent);border-color:var(--accent)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-fg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check .t{flex:1;min-width:0;overflow-wrap:anywhere}
.check .cnt{color:var(--muted);font-size:.82rem;font-weight:500;margin-left:4px;font-variant-numeric:tabular-nums}
.check small{display:block;color:var(--muted);font-size:.76rem}
.check.done .t{opacity:.45;text-decoration:line-through}
.addline{display:flex;gap:8px;flex-wrap:wrap}
.addline input{flex:1 1 180px;min-width:0}
.addline select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 10px;min-height:44px;flex:0 1 auto;max-width:100%}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .4);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:94%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:20px;max-height:88%}}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.progress i{transition:none}}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1;min-width:0;overflow-wrap:anywhere}
.sheet-b>*{flex-shrink:0}
.chips{flex-shrink:0;min-height:48px}
/* categorieën: gewoon in rijen onder elkaar, op elk scherm */
.chips{flex-wrap:wrap;overflow:visible;gap:6px}
.chiparrow{display:none}
.chipgroups{display:flex;flex-direction:column;gap:6px;padding-top:10px;flex-shrink:0}
.chiprow{display:flex;gap:10px;align-items:baseline}
.chiprow .chips{padding:0;min-height:0;flex:1;min-width:0}
.chiplbl{flex:none;width:76px;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:8px}
@media (max-width:420px){.chiprow{flex-direction:column;gap:4px}.chiplbl{width:auto;padding-top:4px}}

.sheet-b{overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 10px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.82rem;font-weight:700;color:var(--muted)}
label.f input,label.f textarea,label.f select,.sel{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:1rem;font-weight:400;color:var(--fg);width:100%;min-width:0}
label.f textarea{min-height:110px;resize:vertical;line-height:1.5}
.step{display:flex;flex-direction:column;gap:8px}
.step-h{display:flex;align-items:baseline;gap:8px}
.step-h .n{font-family:var(--display);font-size:1.05rem;color:var(--accent);font-variant-numeric:tabular-nums}
.step-h b{font-size:.95rem}
.step-h small{color:var(--muted);font-size:.8rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;font-weight:600;font-size:.9rem;min-height:48px}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.selrow{display:flex;gap:8px;align-items:center}
.selrow .sel{flex:1}
.newbox{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.dup{background:var(--mustard-soft);border-radius:10px;padding:10px 12px;font-size:.88rem;display:flex;flex-direction:column;gap:8px}
.ingr{margin:0;padding:0;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ingr li{padding:8px 14px;border-top:1px solid var(--line)}
.ingr li:first-child{border-top:0}
.steps{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:8px 0 0;font-size:.92rem}
details summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:.86rem}
.daygrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.daygrid button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0;font-weight:600;font-size:.76rem;line-height:1.2}
.daygrid button.filled{color:var(--muted);background:var(--sunk)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--sunk);border-radius:var(--r);padding:10px 12px;font-size:.9rem}
.confirm span{flex:1;min-width:180px}
.recs{display:flex;flex-wrap:wrap;gap:6px}

/* tabbalk */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar nav{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{border:0;background:transparent;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted);position:relative}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar svg{width:24px;height:24px}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--mustard);color:#1C1406;font-size:.64rem;border-radius:99px;padding:0 6px;font-variant-numeric:tabular-nums;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;font-weight:600;z-index:40;max-width:calc(100% - 32px);text-align:center}
</style>

</head>
<body>
<div class="wrap" id="app"><p class="note">Je kookboek wordt geladen…</p></div>
<div class="tabbar"><nav id="tabs"></nav></div>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ================= basis ================= */
const DAGNAAM=['zo','ma','di','wo','do','vr','za'];
const DAGLANG=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const TYPES={vlees:'Vlees',vis:'Vis',veggie:'Vegetarisch',groente:'Groenten',saus:'Sauzen',basis:'Zetmeel',variant:'Pureebereidingen',soep:'Soepmaaltijd',speciaal:'Speciaal'};
const WINKEL=['Groenten & fruit','Vlees & vis','Zuivel & eieren','Droge voeding','Overige'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
function zaterdag(d){d=new Date(d);d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+1)%7));return iso(d)}
const kort=s=>{const d=parse(s);return DAGNAAM[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)};
const dm=s=>{const d=parse(s);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')};
const weekLabel=w=>'za '+dm(w)+' – vr '+dm(addDays(w,6));
const VANDAAG=iso(new Date());
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2400)}
const ingrLijst=txt=>String(txt||'').split(/\n|,|;/).map(s=>s.replace(/^[\s\-•*·–]+/,'').trim()).filter(Boolean);
const simpel=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();

/* ingrediënt-identiteit: één naam per product, ongeacht schrijfwijze */
const ALIAS={'knoflook':'look','teentje look':'look','tenen look':'look','ajuin':'ui','ajuinen':'ui','uien':'ui','ajuintje':'ui','aardappel':'aardappelen','patatten':'aardappelen','patatjes':'aardappelen','wortel':'wortelen','worteltjes':'wortelen','tomaat':'tomaten','ei':'eieren','eitjes':'eieren','kipfilets':'kipfilet','kippenfilet':'kipfilet','kippenborst':'kipfilet','champignon':'champignons','sjalotten':'sjalot','courgetten':'courgette','paprikas':'paprika','krielpatatjes':'krielaardappelen','sla':'sla','kropsla':'sla','zout en peper':'peper en zout','peper':'peper en zout','zout':'peper en zout','roomboter':'boter','kookroom':'room','slagroom':'room','tomatenstukjes':'tomatenblokjes','parmezaanse kaas':'parmezaan','spruitjes':'spruiten','boontjes':'boontjes','sperziebonen':'boontjes','prinsessenbonen':'boontjes'};
function ingKey(n){let s=simpel(n);s=ALIAS[s]||s;return s}
function afdeling(n){
  const s=' '+simpel(n)+' ';const has=a=>a.some(k=>s.includes(k));
  if(has(['poeder','kruiden','bouillon','saus','pesto','mosterd','ketchup','mayonaise','azijn',' olie','olie ','olijfolie','sojasaus','ketjap','sambal','harissa','siroop','passata','tomatenblokjes','tomatenpuree','tomatenpulp','concentraat',' blik','peper',' zout','sauzen',' jus ']))return'Droge voeding';

const leegWeek=w=>({start:w,eind:addDays(w,6),dagen:{},extra:[],uit:{},af:{}});
function week(w){if(!S.weken[w])S.weken[w]=leegWeek(w);const x=S.weken[w];x.dagen=x.dagen||{};x.extra=x.extra||[];x.uit=x.uit||{};x.af=x.af||{};return x}
const vierWeken=()=>[0,1,2,3].map(i=>addDays(S.start,i*7));
const actieveComps=t=>[...S.comps.values()].filter(c=>c.type===t&&c.actief!==false).sort((a,b)=>(a.volgorde||0)-(b.volgorde||0)||a.naam.localeCompare(b.naam,'nl'));

/* ================= opslag ================= */
const LS='weekmenu.v2';
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({gerechten:[...S.gerechten.values()],comps:[...S.comps.values()],rec:S.rec,inst:S.inst,weken:S.weken}))}catch(e){}}
function lsLoad(){try{const v=JSON.parse(localStorage.getItem(LS)||'null');if(!v)return;(v.gerechten||[]).forEach(g=>S.gerechten.set(g.id,g));(v.comps||[]).forEach(c=>S.comps.set(c.id,c));S.rec=v.rec||{};S.inst=v.inst||{pers:4};S.weken=v.weken||{}}catch(e){}}
const clean=o=>JSON.parse(JSON.stringify(o));
const queues={};
function schrijf(path,data){ // één schrijfactie tegelijk per document; laatste toestand wint
  if(S.mode!=='db'){lsSave();return Promise.resolve(true)}
  const q=queues[path]||(queues[path]={busy:false,next:null});
  q.next=data===null?{del:true}:{data:clean(data)};
  if(q.busy)return Promise.resolve(true);
  return (async()=>{q.busy=true;let ok=true;
    while(q.next){const job=q.next;q.next=null;
      try{job.del?await db.doc(path).delete():await db.doc(path).set(job.data)}
      catch(e){ok=false;const c=e&&e.code;toast(c==='invalid_argument'?'Je hebt geen rechten om te bewaren':c==='quota_exceeded'?'De opslag is vol':'Bewaren mislukt, probeer opnieuw')}}
    q.busy=false;return ok})();
}
const bewaarWeek=w=>schrijf('weken/'+w,week(w));
const bewaarGerecht=g=>{S.gerechten.set(g.id,g);return schrijf('gerechten/'+g.id,Object.assign({},g,{id:undefined}))};
const verwijderGerecht=id=>{S.gerechten.delete(id);return schrijf('gerechten/'+id,null)};
const bewaarComp=c=>{S.comps.set(c.id,c);return schrijf('componenten/'+c.id,Object.assign({},c,{id:undefined}))};
const bewaarRec=()=>schrijf('config/aanbevelingen',{basis:S.rec});
const bewaarInst=()=>schrijf('config/instellingen',S.inst);

function snapVanGerecht(g,pers){return{naam:g.naam,herkomst:g.herkomst||'Klassiekers',cat:g.cat||'',pers,ingr:[...(g.ingr||[])],ontbreekt:(g.ingr||[]).length?[]:[g.naam],bron:g.id,comp:g.comp||null}}
function compIngr(ids){const ingr=[],ontb=[];ids.filter(Boolean).forEach(id=>{const c=S.comps.get(id);if(!c)return;if(!(c.ingr||[]).length&&!c.geenIngr)ontb.push(c.naam);(c.ingr||[]).forEach(i=>{if(!ingr.some(x=>ingKey(x)===ingKey(i)))ingr.push(i)})});return{ingr,ontb}}
const isFav=s=>!!(s&&s.bron&&S.gerechten.get(s.bron)&&S.gerechten.get(s.bron).fav);
const mist=s=>!!(s&&((s.ontbreekt&&s.ontbreekt.length)||(!(s.ingr||[]).length&&!s.geenIngr)));

/* ================= boodschappen ================= */
function boodschappen(w){
  const W=week(w),map=new Map(),missend=[];
  for(let i=0;i<7;i++){const d=addDays(w,i),dag=W.dagen[d];if(!dag)continue;
    for(const slot of['hoofd','alt']){const s=dag[slot];if(!s||(slot==='alt'&&!dag.altAan))continue;
      if(mist(s))missend.push({d,slot,naam:s.naam,wat:(s.ontbreekt||[]).filter(x=>x!==s.naam)});
      const gezien=new Set();
      for(const n of s.ingr||[]){const k=ingKey(n);if(!k||gezien.has(k))continue;gezien.add(k);
        let e=map.get(k);if(!e){e={key:k,naam:n,cat:afdeling(n),bron:[]};map.set(k,e)}e.bron.push(s.naam)}}}
  for(const x of W.extra){map.set('x:'+x.id,{key:'x:'+x.id,naam:x.naam,cat:x.cat||afdeling(x.naam),bron:[],extra:x.id})}
  const items=[...map.values()],actief=items.filter(e=>!W.uit[e.key]),uit=items.filter(e=>W.uit[e.key]);
  const groepen=WINKEL.map(g=>[g,actief.filter(e=>e.cat===g).sort((a,b)=>a.naam.localeCompare(b.naam,'nl'))]).filter(g=>g[1].length);
  return{groepen,uit,missend,tot:actief.length,af:actief.filter(e=>W.af[e.key]).length};
}

function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}

  doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(90);doc.text(lat('zaterdag '+dm(w)+' t.e.m. vrijdag '+dm(addDays(w,6))+'/'+parse(w).getFullYear()),18,y+7);doc.setTextColor(0);
  y+=18;doc.setDrawColor(200);
  for(let i=0;i<7;i++){const d=addDays(w,i),p=parse(d),dag=W.dagen[d]||{};
    doc.line(18,y-5,192,y-5);
    doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text(lat(DAGLANG[p.getDay()]),18,y+1);doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(110);doc.text(dm(d),18,y+6.5);doc.setTextColor(0);
    let yy=y+1;
    const regel=(s,alt)=>{doc.setFont('helvetica',alt?'normal':'bold');doc.setFontSize(alt?10.5:12);
      const t=doc.splitTextToSize(lat((alt?'Alternatief: ':'')+(s?s.naam:'—')),120);doc.text(t,52,yy);
      if(s){doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(110);doc.text(lat(s.herkomst+(isFav(s)?' * favoriet':'')),52,yy+t.length*5);doc.text(s.pers+' pers.',192,yy,{align:'right'});doc.setTextColor(0)}
      yy+=t.length*5+(s?6:2)};
    regel(dag.hoofd,false);if(dag.altAan&&dag.alt)regel(dag.alt,true);
    if(dag.notitie){doc.setFont('helvetica','italic');doc.setFontSize(9.5);doc.setTextColor(120,90,20);const t=doc.splitTextToSize(lat('Opmerking: '+dag.notitie),138);doc.text(t,52,yy);yy+=t.length*4.5+2;doc.setTextColor(0)}
    y=Math.max(y+16,yy+6);
  }
  doc.line(18,y-5,192,y-5);
  bewaarPdf(doc,'Weekmenu '+w+'.pdf');
}
function pdfLijst(w){
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J){toast('PDF-maker niet geladen');return}
  const doc=new J({unit:'mm',format:'a4'}),b=boodschappen(w),W=week(w);
  doc.setFont('times','normal');doc.setFontSize(22);doc.text('Boodschappen',18,20);
  doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.setTextColor(90);doc.text(lat('Week van zaterdag '+dm(w)+' t.e.m. vrijdag '+dm(addDays(w,6))),18,27);doc.setTextColor(0);
  const cols=[18,108],top=38,bodem=282;let c=0,y=top;
  const nieuweRegel=h=>{if(y+h>bodem){if(c===0){c=1;y=top}else{doc.addPage();c=0;y=20}}};
  for(const[g,items]of b.groepen){nieuweRegel(14);doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(46,106,60);doc.text(lat(g.toUpperCase()),cols[c],y);doc.setTextColor(0);y+=6;
    for(const e of items){const t=doc.splitTextToSize(lat(e.naam+(e.bron.length>1?' ('+e.bron.length+' gerechten)':'')),76);nieuweRegel(t.length*5+1.5);
      doc.setDrawColor(120);doc.rect(cols[c],y-3.4,3.6,3.6);if(W.af[e.key]){doc.line(cols[c]+.6,y-1.6,cols[c]+1.5,y-.4);doc.line(cols[c]+1.5,y-.4,cols[c]+3.2,y-3)}
      doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.text(t,cols[c]+6,y);y+=t.length*5+1.5}
    y+=4}
  if(b.missend.length){nieuweRegel(14);doc.setFontSize(9);doc.setTextColor(150,60,40);doc.text(doc.splitTextToSize(lat('Let op: ingrediënten ontbreken voor '+b.missend.map(m=>m.naam).join(', ')),80),cols[c],y);doc.setTextColor(0)}
  bewaarPdf(doc,'Boodschappen '+w+'.pdf');
}

/* ================= acties ================= */
function zetOpDag(w,d,slot,snap){
  const W=week(w),dag=W.dagen[d]||(W.dagen[d]={});
  if(slot==='alt')dag.altAan=true;
  dag[slot]=snap;bewaarWeek(w);
}

  case'terug':{delete week(w).uit[t.dataset.key];render();bewaarWeek(w);return}
  case'extraweg':{const W=week(w);W.extra=W.extra.filter(x=>x.id!==id);delete W.af['x:'+id];render();bewaarWeek(w);return}
  case'herstel':S.confirm='herstel:'+w;render();return;
  case'herstel-ok':{const W=week(w);W.extra=[];W.uit={};S.confirm=null;render();bewaarWeek(w);toast('Lijst hersteld naar automatisch');return}
  case'kopieer':{const b=boodschappen(w),W=week(w);const txt='Boodschappen '+weekLabel(w)+'\n\n'+b.groepen.map(([g,it])=>{const o=it.filter(e=>!W.af[e.key]);return o.length?g+'\n'+o.map(e=>'- '+e.naam+(e.bron.length>1?' ('+e.bron.length+' gerechten)':'')).join('\n'):''}).filter(Boolean).join('\n\n');

  case'fav':{const g=S.gerechten.get(id);g.fav=!g.fav;bewaarGerecht(g);render();detailSheet(id);return}
  case'bewerkgerecht':gerechtForm(Object.assign({},S.gerechten.get(id)));return;
  case'verwijder':document.getElementById('delConfirm').innerHTML=`<div class="confirm"><span>Uit de bibliotheek verwijderen? Weekmenu's waar het al op staat, blijven intact.</span><button class="btn small danger" data-act="verwijder-ok" data-id="${id}">Verwijderen</button></div>`;return;
  case'verwijder-ok':closeSheet();verwijderGerecht(id);render();toast('Gerecht verwijderd');return;
  case'nieuwgerecht':gerechtForm();return;
  case'samenstellen':startPicker({});SH={type:'picker'};openSheet('Gerecht samenstellen',pickerHTML());return;
  /* picker */
  case'pbasis':if(P.basis!==id){P.basis=id;P.variant=null;P.vol=null;P.nieuw=null;if(P.eiwitCat==='geen')P.eiwitCat='vlees'}rerenderPicker();return;
  case'pcat':P.eiwitCat=t.dataset.c;P.eiwit=null;P.nieuw=null;rerenderPicker();return;
  case'ppers':P.pers=Math.max(1,Math.min(30,P.pers+ +t.dataset.n));rerenderPicker();return;
  case'pnieuw':P.nieuw={type:t.dataset.type,veld:t.dataset.veld,naam:'',ingr:'',dup:null};rerenderPicker();setTimeout(()=>{const n=document.getElementById('nNaam');n&&n.focus()},30);return;
  case'pnieuwweg':P.nieuw=null;rerenderPicker();return;
  case'pgebruik':{const c=S.comps.get(id);if(c.actief===false){c.actief=true;bewaarComp(c)}kiesVeld(P.nieuw.veld,id);P.nieuw=null;rerenderPicker();return}
  case'pbewaar':{const N=P.nieuw;N.naam=document.getElementById('nNaam').value.trim();N.ingr=document.getElementById('nIngr').value;
    if(!N.naam){toast('Geef een naam');return}

    await bewaarComp(c);if(P.basis&&['vlees','vis','veggie','groente'].includes(N.type)){(S.rec[P.basis]=S.rec[P.basis]||[]).push(c.id);bewaarRec()}
    kiesVeld(N.veld,c.id);P.nieuw=null;rerenderPicker();toast(c.naam+' toegevoegd');return}
  case'ptoevoegen':{const snap=pickerSnap();leerCombinatie();zetOpDag(P.w,P.d,P.slot,snap);const dd=P.d;closeSheet();P=null;render();toast(snap.naam+' staat op '+kort(dd));return}
  case'pfav':{const s=pickerSnap();const g={id:'s-'+uid(),naam:s.naam,herkomst:'Samengesteld',cat:s.cat,ingr:s.ingr,comp:s.comp,fav:true,actief:true};leerCombinatie();bewaarGerecht(g);
    if(P.d){s.bron=g.id;zetOpDag(P.w,P.d,P.slot,s);closeSheet();P=null;render();toast('Favoriet bewaard en op het menu gezet')}else{closeSheet();P=null;render();toast('Bewaard als favoriet')}return}
  /* onderdelen */
  case'nieuwcomp':compForm(null,t.dataset.type);return;
  case'bewerkcomp':compForm(Object.assign({},S.comps.get(id)));return;
  case'archief':{const c=S.comps.get(id);c.actief=c.actief===false;bewaarComp(c);closeSheet();render();toast(c.actief?'Teruggezet':'Gearchiveerd');return}
  case'stdpers':S.inst.pers=Math.max(1,Math.min(20,S.inst.pers+ +t.dataset.n));render();bewaarInst();return;
  case'backup':backup();return;

  }

/* ================= back-up ================= */
let restoreData=null;
async function backup(){
  if(!dl){toast('Downloaden kan niet in deze weergave');return}
  let weken=Object.assign({},S.weken);
  if(S.mode==='db'){try{const q=await db.collection('weken').get();q.docs.forEach(x=>weken[x.id]=x.data())}catch(e){}}
  const data={app:'Mijn Weekmenu',versie:2,gemaakt:new Date().toISOString(),gerechten:[...S.gerechten.values()],componenten:[...S.comps.values()],aanbevelingen:S.rec,instellingen:S.inst,weken};
  try{await dl.save({filename:'weekmenu-backup-'+VANDAAG+'.json',data:JSON.stringify(data,null,1)});toast('Back-up klaar')}catch(e){if(e&&e.code!=='declined')toast('Back-up bewaren lukte niet')}
}
async function restore(){
  const v=restoreData;if(!v)return;S.confirm=null;render();toast('Terugzetten…');
  for(const g of v.gerechten)await bewaarGerecht(g);
  for(const c of v.componenten||[])await bewaarComp(c);
  if(v.aanbevelingen){S.rec=v.aanbevelingen;await bewaarRec()}
  if(v.instellingen){S.inst=v.instellingen;await bewaarInst()}
  for(const[w,x]of Object.entries(v.weken||{})){S.weken[w]=x;await schrijf('weken/'+w,x)}
  restoreData=null;render();toast('Back-up teruggezet');
}

/* ================= start ================= */
function subscribeWeeks(){
  if(S.mode!=='db')return;
  unsubWeeks.forEach(u=>u());unsubWeeks=[];
  const ws=new Set([...vierWeken(),S.lijstWeek]);
  ws.forEach(w=>{unsubWeeks.push(db.doc('weken/'+w).onSnapshot(s=>{const q=queues['weken/'+w];if(q&&(q.busy||q.next))return;S.weken[w]=s.exists?clean(s.data()):leegWeek(w);rerenderLive()},()=>{}))});
}
let liveT=null;
function rerenderLive(){ // geen volledige hertekening terwijl iemand typt of een sheet open heeft
  clearTimeout(liveT);liveT=setTimeout(()=>{const a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&a.type!=='checkbox')return;render()},60);
}
render();
(async()=>{
  /* bestanden bewaren of delen: op iPhone via het deelmenu (printen, Bestanden, AirDrop) */
  dl={save:async({filename,data})=>{
    const type=filename.endsWith('.pdf')?'application/pdf':filename.endsWith('.json')?'application/json':'text/plain';
    const blob=data instanceof Blob?data:new Blob([data],{type});
    try{const file=new File([blob],filename,{type});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return{status:'saved'}}}
    catch(e){if(e&&e.name==='AbortError')throw{code:'declined'}}
    const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return{status:'saved'}}};
  S.mode='local';lsLoad();
  if(!S.comps.size){try{const v=await(await fetch('data.json',{cache:'no-cache'})).json();
    (v.gerechten||[]).forEach(g=>S.gerechten.set(g.id,g));(v.componenten||[]).forEach(c=>S.comps.set(c.id,c));S.rec=v.aanbevelingen||{};S.inst=Object.assign({pers:4},v.instellingen||{});lsSave()}catch(e){S.leeg=true}}
  render();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
